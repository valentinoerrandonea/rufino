<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Rounded square background, off-white -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbf8f3"/>
      <stop offset="100%" stop-color="#f0e9dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- macOS-style squircle (≈22.4% radius like Big Sur app icons) -->
  <rect x="64" y="64" width="896" height="896" rx="225" ry="225" fill="url(#bg)"/>

  <!-- Feather centered, accent color (oliva), scaled and positioned -->
  <g transform="translate(220 220) scale(24.5)" stroke="#6b7a4b" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/>
    <path d="M16 8 2 22"/>
    <path d="M17.5 15H9"/>
